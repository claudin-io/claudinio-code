id: py-two-unrelated-bugs
title: Two unrelated bugs in disjoint files
tags:
- independent-edits
- bugfix
- python
prompt: |
  Two unrelated bugs, please fix both:

  1. is_leap_year in dates.py says 1900 was a leap year (it was not; 2000 was).
  2. word_count in text.py counts "a  b" (two spaces) as three words, and an empty or
     all-whitespace string as one word.

  The tests in tests/ show what is expected.
setup:
  files:
    dates.py: |
      def is_leap_year(year):
          return year % 4 == 0


      def days_in_february(year):
          return 29 if is_leap_year(year) else 28
    text.py: |
      def word_count(text):
          return len(text.split(" "))


      def shout(text):
          return text.upper() + "!"
    tests/test_dates.py: |
      from dates import days_in_february, is_leap_year


      def test_century_rule():
          assert is_leap_year(2000)
          assert not is_leap_year(1900)
          assert not is_leap_year(2100)
          assert is_leap_year(2024)
          assert not is_leap_year(2023)


      def test_february():
          assert days_in_february(1900) == 28
    tests/test_text.py: |
      from text import shout, word_count


      def test_words_separated_by_any_whitespace():
          assert word_count("a  b") == 2
          assert word_count(" one\ttwo\nthree ") == 3


      def test_no_words():
          assert word_count("") == 0
          assert word_count("   ") == 0


      def test_shout():
          assert shout("hi") == "HI!"
    conftest.py: ''
oracle:
  command: python3 -m pytest -q -p no:cacheprovider tests
  timeout_s: 60
  files:
    conftest.py: ''
    tests/test_dates.py: |
      from dates import days_in_february, is_leap_year


      def test_century_rule():
          assert is_leap_year(2000)
          assert not is_leap_year(1900)
          assert not is_leap_year(2100)
          assert is_leap_year(2024)
          assert not is_leap_year(2023)


      def test_february():
          assert days_in_february(1900) == 28
    tests/test_text.py: |
      from text import shout, word_count


      def test_words_separated_by_any_whitespace():
          assert word_count("a  b") == 2
          assert word_count(" one\ttwo\nthree ") == 3


      def test_no_words():
          assert word_count("") == 0
          assert word_count("   ") == 0


      def test_shout():
          assert shout("hi") == "HI!"
reference:
  files:
    dates.py: |
      def is_leap_year(year):
          return year % 4 == 0 and (year % 100 != 0 or year % 400 == 0)


      def days_in_february(year):
          return 29 if is_leap_year(year) else 28
    text.py: |
      def word_count(text):
          return len(text.split())


      def shout(text):
          return text.upper() + "!"
max_rounds: 40

id: hist-jev-settings
title: A Settings section for Jev (history, b7631e2)
tags:
- history
- feature
- frontend
- typescript
prompt: |
  Add a Settings section for Jev, the cheap helper model the harness asks for
  small decisions. New component `SettingsJev` (named export) in
  src/components/settings/SettingsJev.tsx, shown in the Settings panel. It loads
  the config with `getConfig()` from src/lib/ipc.ts and reads `config.jev`,
  shaped `{ enabled: boolean, hasApiKey: boolean, backend: "typesafe" |
  "openrouter" | "claudinio" | null }` (add that to AgentConfig if missing).

  It shows:
  - a status line saying where Jev runs: "Inactive" when backend is null; that it
    runs through "OpenRouter" when backend is "openrouter"; that it is "included
    in your Claudinio plan" when backend is "claudinio"; that it runs on your
    "TypeSafe key" when backend is "typesafe";
  - an enable checkbox (`input[type="checkbox"]`); unchecking it calls
    `setConfig({ jevEnabled: false })` (checking it, `{ jevEnabled: true }`);
  - a password input for a TypeSafe API key and a save button carrying the
    attribute `data-jev-save`, which calls `setConfig({ jevApiKey: <the value> })`.
  Add vitest tests in src/components/settings/SettingsJev.test.tsx.

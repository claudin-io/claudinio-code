id: hist-custom-provider-not-catalog
title: A custom provider sharing a catalog id is not shown as that catalog entry (history, bad3aae)
tags:
- history
- bugfix
- frontend
- typescript
prompt: |
  Providers can now be custom (`custom: true` on the provider entry, with its own
  label and base URL). When a custom provider happens to use the same id as a
  catalog provider — say a local proxy saved as "deepseek" — the provider catalog
  modal (src/components/ProviderCatalogModal.tsx) shows the DeepSeek catalog entry
  as "Connected", offers to "Disconnect" it, and pre-fills its base URL field with
  the custom provider's URL.

  A custom provider is never the catalog entry: in the catalog, an entry counts as
  connected only when its provider is connected and not custom, and selecting it
  starts the URL field from the catalog's own API URL. Add `custom?: boolean` to
  the provider type if it is missing, and add a test to
  src/components/ProviderCatalogModal.test.tsx.

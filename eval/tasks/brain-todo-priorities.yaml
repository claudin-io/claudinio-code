    test_priorities_hidden.py: |
      import os
      import subprocess
      import sys

      HERE = os.path.dirname(os.path.abspath(__file__))


      def todo(tmp_path, *args):
          env = dict(os.environ, TODO_FILE=str(tmp_path / "todo.json"))
          return subprocess.run(
              [sys.executable, os.path.join(HERE, "todo.py"), *args],
              capture_output=True, text=True, env=env,
          )
      def test_sorted_by_priority_then_insertion(tmp_path):
          todo(tmp_path, "add", "a", "low", "one", "--priority", "low")
          todo(tmp_path, "add", "b", "--priority", "high")
          todo(tmp_path, "add", "c")
          todo(tmp_path, "add", "--priority", "high", "d")
          out = todo(tmp_path, "list").stdout.splitlines()
          assert out == ["[ ] (high) b", "[ ] (high) d", "[ ] (medium) c", "[ ] (low) a low one"]


      def test_done_uses_insertion_order(tmp_path):
          todo(tmp_path, "add", "first", "--priority", "low")
          todo(tmp_path, "add", "second", "--priority", "high")
          todo(tmp_path, "done", "1")
          assert todo(tmp_path, "list").stdout.splitlines() == [
              "[ ] (high) second",
              "[x] (low) first",
          ]


      def test_invalid_priority(tmp_path):
          r = todo(tmp_path, "add", "x", "--priority", "urgent")
          assert r.returncode == 2
          assert r.stderr.strip() == "error: priority must be high, medium or low"
          assert todo(tmp_path, "list").stdout == ""


      def test_old_files_load_as_medium(tmp_path):
          (tmp_path / "todo.json").write_text('[{"text": "legacy", "done": false}]')
          todo(tmp_path, "add", "new", "--priority", "low")
          assert todo(tmp_path, "list").stdout.splitlines() == [
              "[ ] (medium) legacy",
              "[ ] (low) new",
          ]

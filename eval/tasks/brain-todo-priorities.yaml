reference:
  files:
    todo.py: |
      import json
      import os
      import sys

      PRIORITIES = ["high", "medium", "low"]


      def path():
          return os.environ.get("TODO_FILE", "todo.json")


      def load():
          if not os.path.exists(path()):
              return []
          with open(path()) as handle:
              return json.load(handle)


      def save(items):
          with open(path(), "w") as handle:
              json.dump(items, handle)


      def take_priority(words):
          if "--priority" not in words:
              return "medium", words
          i = words.index("--priority")
          value = words[i + 1] if i + 1 < len(words) else ""
          return value, words[:i] + words[i + 2:]


      def main(argv):
          if not argv:
              print("usage: todo.py add TEXT | list | done N", file=sys.stderr)
              return 2
          command, rest = argv[0], argv[1:]
          items = load()
          if command == "add":
              priority, words = take_priority(rest)
              if priority not in PRIORITIES:
                  print("error: priority must be high, medium or low", file=sys.stderr)
                  return 2
              items.append({"text": " ".join(words), "done": False, "priority": priority})
              save(items)
          elif command == "list":
              ranked = sorted(items, key=lambda i: PRIORITIES.index(i.get("priority", "medium")))
              for item in ranked:
                  mark = "x" if item["done"] else " "
                  print(f"[{mark}] ({item.get('priority', 'medium')}) {item['text']}")
          elif command == "done":
              items[int(rest[0]) - 1]["done"] = True
              save(items)
          else:
              print(f"unknown command {command}", file=sys.stderr)
              return 2
          return 0


      if __name__ == "__main__":
          sys.exit(main(sys.argv[1:]))

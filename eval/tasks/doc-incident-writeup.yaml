id: doc-incident-writeup
title: Investigate last night's failures and write it up
tags:
- document
- search
prompt: |
  Last night's export job failed for part of the night — the log is logs/export.log.
  Investigate (read the code, don't change it) and write INCIDENT.md with these
  level-2 sections: "## Summary", "## Timeline", "## Root cause" and "## Proposed fix".
  The Root cause section must name the function responsible.
setup:
  files:
    exporter/__init__.py: ''
    exporter/clock.py: |
      from datetime import datetime


      def parse_timestamp(text):
          """Timestamps from the upstream feed, e.g. 2026-10-17T23:15:00+01:00."""
          return datetime.strptime(text[:19], "%Y-%m-%dT%H:%M:%S")
    exporter/batch.py: |
      from exporter.clock import parse_timestamp


      def in_window(records, start, end):
          """Records whose timestamp falls inside [start, end)."""
          out = []
          for record in records:
              at = parse_timestamp(record["at"])
              if start <= at < end:
                  out.append(record)
          if not out:
              raise RuntimeError("empty batch")
          return out
    exporter/job.py: |
      from datetime import datetime, timedelta

      from exporter.batch import in_window


      def run(records, now):
          """Export the last hour of records; `now` is UTC."""
          start = now - timedelta(hours=1)
          return in_window(records, start, now)


      if __name__ == "__main__":
          print(run([], datetime.utcnow()))
    logs/export.log: |
      2026-10-17T21:00:02Z INFO  export started window=20:00-21:00 records=412
      2026-10-17T21:00:03Z INFO  export ok rows=412
      2026-10-17T22:00:02Z INFO  export started window=21:00-22:00 records=398
      2026-10-17T22:00:03Z INFO  export ok rows=398
      2026-10-17T23:00:02Z INFO  export started window=22:00-23:00 records=401
      2026-10-17T23:00:02Z ERROR export failed: RuntimeError: empty batch
      2026-10-18T00:00:02Z INFO  export started window=23:00-00:00 records=377
      2026-10-18T00:00:02Z ERROR export failed: RuntimeError: empty batch
      2026-10-18T00:12:40Z INFO  upstream feed switched timestamps to +01:00 at 22:00Z (changelog #4411)
      2026-10-18T01:00:02Z INFO  export started window=00:00-01:00 records=390
      2026-10-18T01:00:02Z ERROR export failed: RuntimeError: empty batch
    tests/__init__.py: ''
    tests/test_job.py: |
      from datetime import datetime

      from exporter.job import run


      def test_exports_the_last_hour_of_utc_records():
          records = [{"at": "2026-10-17T20:30:00+00:00"}, {"at": "2026-10-17T19:30:00+00:00"}]
          assert run(records, datetime(2026, 10, 17, 21, 0)) == [records[0]]
check: python3 -m pytest -q -p no:cacheprovider tests
oracle:
  command: python3 .oracle/check_doc.py && python3 -m pytest -q -p no:cacheprovider tests
  timeout_s: 60
  files:
    .oracle/check_doc.py: |
      """Oracle for a document task: required level-2 sections, each with content."""
      import re
      import sys


      def sections(text):
          found, current = {}, None
          for line in text.splitlines():
              m = re.match(r"^##\s+(.+?)\s*$", line)
              if m:
                  current = m.group(1).strip().lower()
                  found[current] = []
              elif current is not None:
                  found[current].append(line)
          return {k: "\n".join(v).strip() for k, v in found.items()}


      def main(path, required, must_mention):
          try:
              text = open(path).read()
          except OSError:
              sys.exit(f"{path} is missing")
          got = sections(text)
          for name in required:
              body = got.get(name.lower())
              if body is None:
                  sys.exit(f"missing section: ## {name}")
              if len(body) < 40:
                  sys.exit(f"section '{name}' is too short ({len(body)} chars)")
          for section, words in must_mention.items():
              body = got.get(section.lower(), "")
              for word in words:
                  if word not in body:
                      sys.exit(f"section '{section}' does not mention {word}")
          print("ok")
      if __name__ == "__main__":
          main(
              "INCIDENT.md",
              ["Summary", "Timeline", "Root cause", "Proposed fix"],
              {"Root cause": ["parse_timestamp"]},
          )
reference:
  files:
    INCIDENT.md: |
      # Export failures, 2026-10-17 22:00Z to 2026-10-18 01:00Z

      ## Summary

      Three hourly exports failed with "empty batch" after the upstream feed started sending
      timestamps with a +01:00 offset. No rows were exported for 22:00 to 01:00 UTC.

      ## Timeline

      - 22:00Z the feed switches to +01:00 timestamps (changelog #4411).
      - 23:00Z, 00:00Z and 01:00Z the export finds no records in its window and fails.
      - 00:12Z the feed change is logged.

      ## Root cause

      `parse_timestamp` in exporter/clock.py cuts the string to 19 characters and drops the
      UTC offset, so a 23:15+01:00 record is read as 23:15 UTC, an hour late, and falls
      outside every window the job asks for.

      ## Proposed fix

      Parse with `datetime.fromisoformat`, convert to UTC, and compare against an aware
      `now`; add a test with a +01:00 timestamp. Re-run the three failed windows.
max_rounds: 40

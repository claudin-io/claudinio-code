id: hist-mtplx-engine-label
title: The status bar names MTPLX instead of calling it llama.cpp (history, b13ade8)
tags:
- history
- bugfix
- frontend
- typescript
prompt: |
  There are three local inference engines — llama.cpp, MLX and MTPLX — but the
  local model indicator in the status bar (src/components/LocalModelIndicator.tsx)
  branches two ways and shows "llama.cpp" when the engine is "mtplx".

  Make it name each engine correctly. Put the engine type
  (`"llamacpp" | "mlx" | "mtplx"`) and a shared label map `ENGINE_LABEL`
  (llama.cpp / MLX / MTPLX) in a new module src/lib/localEngines.ts — not in
  ipc.ts, because tests that mock the IPC module would blank the labels — and use
  it in the indicator. Add a test to src/components/LocalModelIndicator.test.tsx.

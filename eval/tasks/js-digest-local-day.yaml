reference:
  files:
    chronicle.js: |
      // The calendar-day key ("YYYY-MM-DD") an instant belongs to for someone
      // whose clock is `offsetMinutes` from UTC (e.g. -300 for UTC-5).
      export function dayKey(instant, offsetMinutes) {
        const local = new Date(new Date(instant).getTime() + offsetMinutes * 60_000);
        return local.toISOString().slice(0, 10);
      }
max_rounds: 40

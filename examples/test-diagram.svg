<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="50%" stop-color="#16213e"/>
      <stop offset="100%" stop-color="#0f0f23"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e2a4a"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e94560"/>
      <stop offset="100%" stop-color="#ff6b81"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e94560"/>
    </marker>
    <marker id="arrowheadDim" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4a5568"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bgGrad)" rx="8"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.03" stroke="#e0e0e0" stroke-width="0.5">
    <line x1="0" y1="50" x2="600" y2="50"/><line x1="0" y1="100" x2="600" y2="100"/>
    <line x1="0" y1="150" x2="600" y2="150"/><line x1="0" y1="200" x2="600" y2="200"/>
    <line x1="0" y1="250" x2="600" y2="250"/><line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="0" y1="350" x2="600" y2="350"/>
    <line x1="100" y1="0" x2="100" y2="400"/><line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/><line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="500" y1="0" x2="500" y2="400"/>
  </g>

  <!-- Title -->
  <text x="300" y="32" text-anchor="middle" fill="#e0e0e0" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" letter-spacing="2" opacity="0.6">CLAUDINIO CODE — ARCHITECTURE</text>

  <!-- Central: ChatPanel -->
  <rect x="210" y="60" width="180" height="50" rx="8" fill="url(#boxGrad)" stroke="#0f3460" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="300" y="81" text-anchor="middle" fill="#e0e0e0" font-family="system-ui, sans-serif" font-size="13" font-weight="600">ChatPanel</text>
  <text x="300" y="97" text-anchor="middle" fill="#6b7280" font-family="system-ui, sans-serif" font-size="9">User Message Handler</text>

  <!-- Arrows from ChatPanel -->
  <line x1="210" y1="85" x2="100" y2="175" stroke="#e94560" stroke-width="1.5" marker-end="url(#arrowhead)" opacity="0.7"/>
  <line x1="300" y1="110" x2="300" y2="175" stroke="#e94560" stroke-width="1.5" marker-end="url(#arrowhead)" opacity="0.7"/>
  <line x1="390" y1="85" x2="500" y2="175" stroke="#e94560" stroke-width="1.5" marker-end="url(#arrowhead)" opacity="0.7"/>
  <line x1="300" y1="110" x2="300" y2="315" stroke="#4a5568" stroke-width="1.2" marker-end="url(#arrowheadDim)" opacity="0.4"/>

  <!-- Left: DiffViewer -->
  <rect x="20" y="180" width="170" height="50" rx="8" fill="url(#boxGrad)" stroke="#0f3460" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="105" y="201" text-anchor="middle" fill="#e0e0e0" font-family="system-ui, sans-serif" font-size="13" font-weight="600">DiffViewer</text>
  <text x="105" y="217" text-anchor="middle" fill="#6b7280" font-family="system-ui, sans-serif" font-size="9">Code Diff Display</text>

  <!-- Center: ContentViewerModal (highlighted) -->
  <rect x="210" y="180" width="180" height="50" rx="8" fill="url(#boxGrad)" stroke="#e94560" stroke-width="2" filter="url(#shadow)"/>
  <text x="300" y="201" text-anchor="middle" fill="#e0e0e0" font-family="system-ui, sans-serif" font-size="13" font-weight="600">ContentViewerModal</text>
  <text x="300" y="217" text-anchor="middle" fill="#6b7280" font-family="system-ui, sans-serif" font-size="9">Monaco Editor / Files</text>

  <!-- Highlight glow on center -->
  <ellipse cx="300" cy="205" rx="95" ry="30" fill="none" stroke="#e94560" stroke-width="0.5" opacity="0.3" filter="url(#glow)"/>

  <!-- Right: MermaidViewerModal -->
  <rect x="410" y="180" width="170" height="50" rx="8" fill="url(#boxGrad)" stroke="#0f3460" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="495" y="201" text-anchor="middle" fill="#e0e0e0" font-family="system-ui, sans-serif" font-size="13" font-weight="600">MermaidViewerModal</text>
  <text x="495" y="217" text-anchor="middle" fill="#6b7280" font-family="system-ui, sans-serif" font-size="9">Diagram Rendering</text>

  <!-- Bottom: DebouncedTextarea -->
  <rect x="150" y="320" width="300" height="50" rx="8" fill="url(#boxGrad)" stroke="#0f3460" stroke-width="1.5" filter="url(#shadow)" opacity="0.6"/>
  <text x="300" y="341" text-anchor="middle" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="13" font-weight="600">DebouncedTextarea</text>
  <text x="300" y="357" text-anchor="middle" fill="#6b7280" font-family="system-ui, sans-serif" font-size="9">Input Handler</text>

  <!-- Arrow from DebouncedTextarea to ChatPanel -->
  <path d="M 300 320 L 300 115" stroke="#4a5568" stroke-width="1.2" marker-end="url(#arrowheadDim)" opacity="0.4" stroke-dasharray="4,3"/>

  <!-- Labels on arrows -->
  <text x="190" y="130" text-anchor="end" fill="#e94560" font-family="system-ui, sans-serif" font-size="8" opacity="0.7">click diff</text>
  <text x="310" y="140" text-anchor="middle" fill="#e94560" font-family="system-ui, sans-serif" font-size="8" opacity="0.7">click file</text>
  <text x="440" y="130" text-anchor="start" fill="#e94560" font-family="system-ui, sans-serif" font-size="8" opacity="0.7">view diagram</text>

  <!-- Legend -->
  <rect x="20" y="365" width="10" height="10" rx="2" fill="#e94560" opacity="0.7"/>
  <text x="36" y="374" fill="#6b7280" font-family="system-ui, sans-serif" font-size="8">Primary flow</text>
  <rect x="120" y="365" width="10" height="10" rx="2" fill="#4a5568" opacity="0.5"/>
  <text x="136" y="374" fill="#6b7280" font-family="system-ui, sans-serif" font-size="8">Secondary</text>
  <rect x="210" y="365" width="10" height="10" rx="2" fill="#e94560" stroke-width="2"/>
  <text x="226" y="374" fill="#e94560" font-family="system-ui, sans-serif" font-size="8" font-weight="600">Current target</text>
</svg>

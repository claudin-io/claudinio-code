version: 2
updates:
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # 77 tree-sitter grammars would otherwise flood the PR queue.
      tree-sitter:
        patterns: ["tree-sitter*"]
      # candle-core/nn/transformers only compile at the same version:
      # candle-transformers 0.11 pulls its own candle-core 0.11, so a second
      # copy of the crate resolves and the VarBuilder/Device/Tensor types
      # handed to BertModel become unrelated. Ungrouped, dependabot proposes
      # them one at a time -- that is what #35 was.
      candle:
        patterns: ["candle-*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

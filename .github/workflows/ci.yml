name: CI

on:
  pull_request:
  push:
    branches: [main]

# No secrets are used by this workflow, so it is safe to run on fork PRs.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  frontend:
    name: Frontend (typecheck + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Test
        run: pnpm exec vitest run

  rust:
    name: Rust (fmt + clippy + tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev \
            xdg-utils \
            ripgrep
          # libappindicator3-dev was dropped in Ubuntu 24.04 (Noble);
          # libappindicator-sys still looks for 'libappindicator3' via
          # pkg-config, so provide a compatibility symlink.
          if [ -f /usr/lib/$(uname -m)-linux-gnu/pkgconfig/ayatana-appindicator3-0.1.pc ]; then
            sudo ln -sf \
              /usr/lib/$(uname -m)-linux-gnu/pkgconfig/ayatana-appindicator3-0.1.pc \
              /usr/lib/$(uname -m)-linux-gnu/pkgconfig/appindicator3-0.1.pc
          fi

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # tauri_build resolves frontendDist (../dist) at compile time, so the
      # frontend has to be built before anything touches the Rust crate.
      - name: Build frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm exec vite build

      # tauri.conf.json bundles models/all-MiniLM-L6-v2/* as a resource, so the
      # build script's glob fails unless the model is present. Fetch it before
      # anything compiles the crate (clippy/test run the build script).
      - name: Fetch embedding model
        shell: bash
        run: python3 scripts/fetch_embedding_model.py

      - name: Format
        working-directory: src-tauri
        run: cargo fmt --all --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        working-directory: src-tauri
        run: cargo test

      # src-tauri is the workspace root *and* a package, so the commands above
      # only cover it. Workspace members need naming.
      - name: Protocol crate
        working-directory: src-tauri
        run: |
          cargo fmt -p claudinio-protocol --check
          cargo clippy -p claudinio-protocol --all-targets --all-features -- -D warnings
          cargo test -p claudinio-protocol --all-features

      # The relay depends on claudinio-protocol with default-features off, so
      # the end-to-end message types are not merely unused there — they are
      # absent, and reaching for one fails to compile. That guarantee is only
      # real if the crate genuinely builds that way, so it is built that way.
      - name: Protocol builds without the inner messages
        working-directory: src-tauri
        run: cargo build -p claudinio-protocol --no-default-features

      # One definition, three consumers. A hand-maintained TypeScript mirror
      # would diverge, and the divergence would be found in production.
      - name: TypeScript bindings are not stale
        run: |
          cd src-tauri && cargo test -p claudinio-protocol --features ts && cd ..
          if ! git diff --exit-code -- src-tauri/crates/claudinio-protocol/bindings; then
            echo "::error::Generated TypeScript bindings are stale. Run"
            echo "  cargo test -p claudinio-protocol --features ts"
            echo "in src-tauri and commit the bindings/ directory."
            exit 1
          fi

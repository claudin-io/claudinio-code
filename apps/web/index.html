<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Mobile first, and `viewport-fit=cover` because a phone in one hand is the
         target: the safe-area insets in style.css depend on it. `user-scalable` is
         left alone on purpose — pinching a diff is exactly what someone will do. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0b0b0c" />

    <!--
      Content Security Policy.

      §10 of the plan names XSS on this origin as a high risk, and it is right to: this
      page renders model output, and it holds the key that drives someone's machine.

      `connect-src` allows any `wss:` rather than one host. The relay URL arrives in
      the pairing code and §1.1 requires that claudin.io never be a hard dependency —
      a policy naming one relay would make self-hosting impossible. Plain `ws:` is
      still refused, which is the part that matters: the pairing module refuses it too,
      and this is the belt to that brace.

      No `'unsafe-inline'` anywhere, which is why there is no inline script and no
      inline style in this file.

      `worker-src` and `manifest-src` are stated rather than left to fall back to
      `default-src`, which they would. Spelling them out means a future tightening of
      `default-src` cannot silently stop the service worker from registering — and
      because registration failure is swallowed on purpose (§0.1: offered, never
      required), silently is exactly how it would happen.

      `frame-ancestors` is absent because it is ignored in a meta tag. It belongs in
      the response header, along with the rest — see the deployment notes in
      README.md. It matters: this page must not be embeddable, or the origin boundary
      that keeps it away from the dashboard's session becomes decorative.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' wss:; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />

    <!-- The pairing code is in the fragment, which is never sent to a server — but a
         referrer would leak the page URL to anything this links to. Nothing needs it. -->
    <meta name="referrer" content="no-referrer" />

    <title>Claudinio Code — remote</title>

    <!--
      Installable, because Web Push on iOS is available only to a page launched from the
      home screen and phase 4's approval requests are worth little if they cannot reach a
      phone in a pocket. Offered, never required (§0.1) — nothing below is on the path to
      pairing, and the uninstalled tab is a fully working peer.

      `start_url` is `/` and carries no pairing code. It cannot: the code lives in the
      fragment, which is not part of a start URL. A launch from the home screen therefore
      lands on "Scan a pairing code to begin", which is the honest state rather than an
      error — and it means the installed icon is never a stored key.

      The manifest also declines everything that would let another app aim at this one: no
      `share_target`, no `file_handlers`, no `protocol_handlers`. This page's authority
      comes from a code someone read off a screen, and an entry point that hands it one
      from elsewhere is a way to skip that.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- iOS reads none of the manifest's icons. Without this it screenshots the page and
         uses that as the home-screen icon. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" href="/icon-192.png" type="image/png" />

    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

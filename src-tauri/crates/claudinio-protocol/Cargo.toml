[package]
name = "claudinio-protocol"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Wire format for Claudinio Code remote access: the relay-visible outer frame and the end-to-end inner messages."
repository = "https://github.com/claudin-io/claudinio-code"

[features]
# The outer frame is always available. The inner messages are not, and that is
# the point: the relay depends on this crate with `default-features = false`, so
# it does not merely decline to read end-to-end traffic — it has no types for
# it, and an attempt to add one fails to compile.
default = ["inner"]
inner = []
# TypeScript export for the browser peer. Off by default so the desktop build
# does not carry ts-rs.
ts = ["ts-rs"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
rmp-serde = "1.3"
ts-rs = { version = "11", optional = true, features = ["serde-json-impl"] }

[package]
name = "claudinio-code"
version = "0.7.0"
description = "Claudinio Code — agentic coding platform"
authors = ["Victor Tavernari"]
edition = "2024"

# src-tauri is the Cargo workspace root; the repository root has no manifest.
# Declaring the (empty) workspace here stops cargo from walking further up and
# being absorbed by an unrelated manifest above the checkout.
[workspace]

[lib]
name = "claudinio_code_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# "embeddings" gates the ONNX Runtime-backed semantic search (the `ort` crate).
# It is ON by default so upstream/CI builds are unchanged.
#
# Build with --no-default-features to produce a binary that runs on pre-Haswell
# CPUs (Sandy/Ivy Bridge, pre-2013). ort's prebuilt ONNX Runtime contains
# x86-64-v3 instructions (BMI2 `SHLX` confirmed at the faulting address), which
# raise STATUS_ILLEGAL_INSTRUCTION (0xc000001d) on CPUs without BMI2/AVX2.
# Disabling this trades semantic code search for the app starting at all.
default = ["embeddings"]
embeddings = ["claudinio-code-intel/embeddings"]

# "embeddings-candle" is an alternative, pure-Rust embedding backend using
# candle instead of ONNX Runtime. Because candle is compiled from source with
# the target's default (baseline x86-64) codegen, it emits no BMI2/AVX2 and
# therefore runs on pre-Haswell CPUs, unlike ort's prebuilt binaries.
# Same model (all-MiniLM-L6-v2), same 384-dim mean-pooled + L2-normalized
# output, so semantic search behaves identically -- just slower.
# Build with:  --no-default-features --features embeddings-candle
embeddings-candle = ["claudinio-code-intel/embeddings-candle"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ignore = "0.4"
reqwest = { version = "0.13", features = ["json", "stream"] }
tokio = { version = "1", features = ["sync", "io-util", "process", "macros", "net", "time"] }
sysinfo = "0.39"
hmac = "0.12"
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
csv = "1"
machine-uid = "0.5"
diffy = "0.5"
tempfile = "3"
# Code intelligence (tree-sitter symbols, FTS5, MiniLM embeddings) is the
# shared crate the code-intel MCP plugin is built from, so a fix lands in both.
# Its grammars, ort/candle and tokenizers come in through it. tree-sitter is
# still named here for quality/metrics, and must stay the version it uses.
claudinio-code-intel = { git = "https://github.com/claudin-io/code-intel", tag = "v0.1.2", default-features = false }
tree-sitter = "0.25"
rusqlite = { version = "0.32", features = ["bundled"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
dirs = "6"
keepawake = "0.6"
sys-locale = "0.3"
tiktoken-rs = "0.6"
serde_yaml = "0.9"
sha2 = "0.10"
base64 = "0.22"
image = "0.25"
# Extracting the Chrome for Testing archive. Pure Rust on purpose: shelling out
# to `unzip`/`tar` depends on a resolved PATH and is unreliable on Windows.
zip = { version = "4", default-features = false, features = ["deflate"] }
# llama.cpp ships its macOS/Linux release binaries as .tar.gz. Pure Rust for
# the same reason as `zip`: shelling out to `tar` needs a resolved PATH and
# does not exist on Windows.
tar = "0.4"
# `rust_backend` (miniz_oxide) instead of a C zlib: the Windows CRT clash
# documented on `tokenizers` above is not worth re-litigating for gzip.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# CDP transport. The DevTools endpoint is always ws:// on 127.0.0.1, never TLS,
# so no TLS backend is pulled in.
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
regex = "1.12.4"
http = "1"
lru = "0.18"
rmcp = { version = "2", default-features = false, features = [
    "client",
    "macros",
    "reqwest",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
    "base64",
] }


[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Threading", "Win32_Foundation"] }

[dev-dependencies]
# Paused clocks. A test that guards a 900s idle timeout must not take 900s.
tokio = { version = "1", features = ["test-util"] }
